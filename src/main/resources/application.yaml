server:
  address: 127.0.0.1
  port: ${P20_PORT:8220}
  tomcat:
    threads:
      max: 32
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: project20-stock-reservation
  datasource:
    url: ${P20_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/project20}
    username: ${P20_DATABASE_USER:demo}
    password: ${P20_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 24
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
